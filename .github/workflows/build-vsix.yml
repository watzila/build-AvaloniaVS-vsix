name: Build AvaloniaVS VSIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Official Repo ARCHIVE Branch
        uses: actions/checkout@v4
        with:
          repository: 'AvaloniaUI/AvaloniaVS'
          ref: 'ARCHIVE'
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore AvaloniaVS.sln

      # 直接針對整個 sln 編譯 VS2022 目標，並關閉強名稱簽名限制
      - name: Build AvaloniaVS.VS2022
        run: |
          msbuild AvaloniaVS.sln /t:AvaloniaVS_VS2022 /p:Configuration=Release /p:DeployExtension=false /p:SignAssembly=false /p:DelaySign=false /p:PublicSign=false /p:FailOnMissingPkgDef=false

      # 搜尋產生的 .vsix 檔案路徑以驗證
      - name: Verify VSIX
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path . -Filter "*.vsix" -Recurse
          if ($vsix) {
            Write-Host "成功生成 VSIX 檔案："
            $vsix | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Error "未找到任何 .vsix 檔案！"
            exit 1
          }

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvaloniaVS-VS2022-VSIX
          path: "**/bin/Release/**/*.vsix"
