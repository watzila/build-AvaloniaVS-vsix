name: Build AvaloniaVS VSIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Official Repo ARCHIVE Branch
        uses: actions/checkout@v4
        with:
          repository: 'AvaloniaUI/AvaloniaVS'
          ref: 'ARCHIVE'
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore AvaloniaVS.sln

      # 關鍵步驟：修改 VSIX Manifest 版本號為 999.0.0，防止任何商店更新覆蓋
      - name: Patch VSIX Manifest Version
        shell: pwsh
        run: |
          $manifestPaths = Get-ChildItem -Path . -Filter "source.extension.vsixmanifest" -Recurse
          foreach ($file in $manifestPaths) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            # 將版本號改為極大值，商店版本永遠不可能比它高
            $content = $content -replace '<Identity Id="([^"]+)" Version="([^"]+)"', '<Identity Id="$1" Version="999.0.0"'
            # 更改顯示名稱，方便在延伸模組列表一眼認出
            $content = $content -replace '<DisplayName>([^<]+)</DisplayName>', '<DisplayName>Avalonia for Visual Studio (Community Free)</DisplayName>'
            [System.IO.File]::WriteAllText($file.FullName, $content)
            Write-Host "已修改版本號於: $($file.FullName)"
          }

      # 編譯主專案（同時保留 PublicSign 修正先前的閃退問題）
      - name: Build AvaloniaVS.VS2022
        run: |
          msbuild AvaloniaVS.sln /t:AvaloniaVS_VS2022 /p:Configuration=Release /p:DeployExtension=false /p:PublicSign=true /p:DelaySign=false /p:SignAssembly=false /p:FailOnMissingPkgDef=false

      - name: Prepare Assets for Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release_assets
          $vsix = Get-ChildItem -Path . -Filter "*.vsix" -Recurse | Select-Object -First 1
          if ($vsix) {
            Copy-Item $vsix.FullName -Destination ./release_assets/AvaloniaVS.VS2022.vsix
            Write-Host "已準備發布檔案: $($vsix.FullName)"
          } else {
            Write-Error "找不到 .vsix 檔案！"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AvaloniaVS Build"
          body: |
            這個版本已鎖定版本號為 999.0.0，安裝後 Visual Studio **不會**再自動被商店更新為商業付費版。
          files: ./release_assets/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
