name: Build AvaloniaVS VSIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Official Repo ARCHIVE Branch
        uses: actions/checkout@v4
        with:
          repository: 'AvaloniaUI/AvaloniaVS'
          ref: 'ARCHIVE'
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore AvaloniaVS.sln

      # 1. 產生臨時強名稱金鑰，解決 CreatePkgDef 與 Code View 閃退問題
      - name: Generate Strong Name Key
        shell: pwsh
        run: |
          $snExe = (Get-ChildItem -Path "C:\Program Files (x86)\Microsoft SDKs\Windows" -Filter "sn.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $snExe) {
            Write-Error "找不到 sn.exe 工具！"
            exit 1
          }
          Write-Host "使用工具: $snExe"
          & $snExe -k temp.snk
          Write-Host "成功生成 temp.snk"

      # 2. 修改 VSIX Manifest 版本號為 999.0.0，防止任何商店更新覆蓋
      - name: Patch VSIX Manifest Version
        shell: pwsh
        run: |
          $manifestPaths = Get-ChildItem -Path . -Filter "source.extension.vsixmanifest" -Recurse
          foreach ($file in $manifestPaths) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            $content = $content -replace '<Identity Id="([^"]+)" Version="([^"]+)"', '<Identity Id="$1" Version="999.0.0"'
            $content = $content -replace '<DisplayName>([^<]+)</DisplayName>', '<DisplayName>Avalonia for Visual Studio (Community Free)</DisplayName>'
            [System.IO.File]::WriteAllText($file.FullName, $content)
            Write-Host "已修改版本號於: $($file.FullName)"
          }

      # 3. 編譯主專案，傳入金鑰檔案
      - name: Build AvaloniaVS.VS2022
        run: |
          msbuild AvaloniaVS.sln /t:AvaloniaVS_VS2022 /p:Configuration=Release /p:DeployExtension=false /p:SignAssembly=true /p:AssemblyOriginatorKeyFile="${{ github.workspace }}\temp.snk" /p:FailOnMissingPkgDef=false

      # 4. 準備發布檔案
      - name: Prepare Assets for Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release_assets
          $vsix = Get-ChildItem -Path . -Filter "*.vsix" -Recurse | Select-Object -First 1
          if ($vsix) {
            Copy-Item $vsix.FullName -Destination ./release_assets/AvaloniaVS.VS2022.vsix
            Write-Host "已準備發布檔案: $($vsix.FullName)"
          } else {
            Write-Error "找不到 .vsix 檔案！"
            exit 1
          }

      # 5. 建立 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AvaloniaVS Build"
          body: |
            這是由 GitHub Actions 自動建置的 Avalonia for Visual Studio 2022 (ARCHIVE 分支 / MIT 協議)。
            
            ### 安裝提醒：
            1. 關閉 Visual Studio 2022。
            2. 雙擊下載的 `AvaloniaVS.VS2022.vsix` 進行安裝。
            3. 安裝完成後，請至 VS 的「延伸模組 -> 管理延伸模組」中將其**關閉自動更新**。
          files: ./release_assets/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
